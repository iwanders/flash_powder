[workspace]
resolver = "2"

members = [
    "torch_stable",
    "flash_powder",
    "flash_powder_safetensors",
    "flash_powder_image",
    "example_vgg",
    "example_pytorch_extension"
, "experiments/backward"]


[workspace.dependencies]

torch_stable = { version = "0.1.0", path = "./torch_stable/"}
flash_powder = { version = "0.1.0", path = "./flash_powder/"}
flash_powder_safetensors = { version = "0.1.0", path = "./flash_powder_safetensors/"}
flash_powder_image = { version = "0.1.0", path = "./flash_powder_image/"}
example_vgg = { version = "0.1.0", path = "./example_vgg/"}
example_pytorch_extension = { version = "0.1.0", path = "./example_pytorch_extension/"}


cc = "1.0"

libc = "0.2.183"
anyhow = "1.0.102"
zerocopy = "0.8.48"
tinyvec = "1.11.0"


# Very broad version, such that the consumer can pick it if they want to.
safetensors = "0.8"
image = {version="0.25" , default-features=false}

# Also allowed by rustc; https://github.com/rust-lang/rust/blob/1.97.1/src/tools/tidy/src/deps.rs#L367
memmap2 = "0.9"


[workspace.lints.clippy]
# I want to be able to do assert_eq!(a.is_contiguous(), false); instead of assert_eq!(!a.is_contiguous()).
#![allow(clippy::bool_assert_comparison)]
bool_assert_comparison = "allow"
#![allow(clippy::excessive_precision)]
excessive_precision = "allow"
